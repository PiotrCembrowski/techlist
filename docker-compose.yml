# Local PostgreSQL 16 for development and tests.
# `pnpm db:up` starts it; the init script creates the test database and extensions.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: specbase
      POSTGRES_PASSWORD: specbase
      POSTGRES_DB: specbase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specbase -d specbase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
